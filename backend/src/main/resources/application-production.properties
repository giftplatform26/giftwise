# Explicit opt-in. No credentials or deployment attestations are embedded.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.probes.enabled=true
gift.production.public-origin=${GIFT_PRODUCTION_PUBLIC_ORIGIN:}
gift.production.instance-count=${GIFT_PRODUCTION_INSTANCE_COUNT:1}
gift.guestbook.photos.dir=${GIFT_GUESTBOOK_PHOTOS_DIR:}
gift.otp.secret-base64=${GIFT_OTP_SECRET_BASE64:}
gift.otp.hmac-key-base64=${GIFT_OTP_HMAC_KEY_BASE64:}
gift.payment.encryption-key-base64=${GIFT_PAYMENT_ENCRYPTION_KEY_BASE64:}
gift.payment.fingerprint-key-base64=${GIFT_PAYMENT_FINGERPRINT_KEY_BASE64:}
gift.otp.sms.simulator.enabled=false
# Defaults do not authorize live collection. Existing test-mode enforcement remains.
gift.invitation.ai.enabled=${GIFT_INVITATION_AI_ENABLED:false}
gift.payment.settlement-ui.enabled=false
