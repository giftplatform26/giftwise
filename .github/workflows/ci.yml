# Runs every check on each push and pull request: backend unit + integration tests, web app, marketing website, mobile shell.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Test configuration (application.properties is not committed)
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties
      - name: Throwaway test secrets (never real keys)
        run: |
          echo "GIFT_PAYMENT_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "GIFT_PAYMENT_FINGERPRINT_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=unused-in-tests" >> "$GITHUB_ENV"
      - run: ./mvnw -B -ntp test

  backend-integration:
    name: Backend integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cp src/main/resources/application.properties.example src/main/resources/application.properties
      - name: Throwaway test secrets (never real keys)
        run: |
          echo "GIFT_PAYMENT_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "GIFT_PAYMENT_FINGERPRINT_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=unused-in-tests" >> "$GITHUB_ENV"
      - run: ./mvnw -B -ntp test-compile failsafe:integration-test failsafe:verify
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: integration-reports, path: backend/target/failsafe-reports, retention-days: 7 }

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npx next build

  website:
    name: Marketing website
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  mobile:
    name: Mobile shell
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/giftwise-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: backend/giftwise-mobile/package-lock.json }
      - run: npm ci
      - run: npm test
